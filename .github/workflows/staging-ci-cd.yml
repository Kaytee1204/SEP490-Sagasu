name: Staging CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  backend-build:
    name: Backend (Spring Boot Java 21) Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE-main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile and Package Backend (Skip Integration DB Tests in CI)
        run: mvn clean package -DskipTests -B

  frontend-build:
    name: Frontend (React + Vite Staging) Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FE-main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: FE-main/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Staging Bundle
        env:
          VITE_APP_ENV: staging
          VITE_API_URL: ${{ vars.STAGING_API_URL || 'http://localhost:8080/api' }}
        run: npm run build:staging

  trigger-cloud-deploy:
    name: Trigger Staging Cloud Deploy Hooks
    needs: [backend-build, frontend-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Backend Deploy Hook (Render / Railway)
        env:
          DEPLOY_HOOK: ${{ secrets.STAGING_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsSL -X POST "$DEPLOY_HOOK"
          else
            echo "STAGING_BACKEND_DEPLOY_HOOK is not configured, skipping."
          fi

      - name: Trigger Frontend Deploy Hook (Vercel / Netlify / Render)
        env:
          DEPLOY_HOOK: ${{ secrets.STAGING_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            curl -fsSL -X POST "$DEPLOY_HOOK"
          else
            echo "STAGING_FRONTEND_DEPLOY_HOOK is not configured, skipping."
          fi
